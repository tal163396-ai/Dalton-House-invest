<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dalton House</title>
<meta name="description" content="준환·나예 가족 투자 자산 현황">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dalton House">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=3">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="app.css?v=42">
</head>
<body>

<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <img src="icons/icon-192.png?v=3" alt="" class="login-icon" width="64" height="64">
    <h1>Dalton House</h1>
    <p class="login-sub">우리 집 투자 현황</p>
    <div class="field">
      <span>사용자</span>
      <div class="chips" id="nameChips">
        <button type="button" class="chip" data-name="준환">준환</button>
        <button type="button" class="chip" data-name="나예">나예</button>
      </div>
    </div>
    <label class="field">
      <span>비밀번호</span>
      <input id="pwInput" type="password" autocomplete="current-password" required>
    </label>
    <p id="loginError" class="form-error" role="alert"></p>
    <button class="btn primary" type="submit" id="loginBtn">들어가기</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon-192.png?v=3" alt="" width="30" height="30">
      <div class="brand-text">
        <div class="brand-name">Dalton House</div>
        <span id="updated" class="updated"></span>
      </div>
    </div>
    <button id="maskBtn" class="icon-btn" aria-label="숫자 가리기" aria-pressed="false">
      <svg class="eye-on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
    </button>
    <button id="refreshBtn" class="icon-btn" aria-label="새로고침">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <button id="menuBtn" class="icon-btn" aria-label="설정">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main>
    <section id="view-home" class="view" aria-label="포트폴리오"></section>
    <section id="view-record" class="view" aria-label="기록" hidden></section>
    <section id="view-years" class="view" aria-label="수익률" hidden></section>
    <section id="view-assets" class="view" aria-label="보유자산" hidden></section>
  </main>

  <nav class="tabbar" aria-label="화면 이동">
    <button class="tab active" data-view="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="10" height="11" rx="2" fill="currentColor"/><rect x="15" y="3" width="6" height="6" rx="1.6" fill="currentColor" opacity=".55"/><rect x="15" y="11" width="6" height="10" rx="1.6" fill="currentColor" opacity=".75"/><rect x="3" y="16" width="10" height="5" rx="1.6" fill="currentColor" opacity=".55"/></svg>
      <span>포트폴리오</span>
    </button>
    <button class="tab" data-view="assets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6.5" r="1.6" fill="currentColor"/><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="5" cy="17.5" r="1.6" fill="currentColor"/><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      <span>보유자산</span>
    </button>
    <button class="tab" data-view="years">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17.5l5-5 4 3.5 8-8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7.5h5.5V13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>수익률</span>
    </button>
    <button class="tab" data-view="record">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      <span>기록</span>
    </button>
</nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle" data-close></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js?v=1"></script>
<script src="app.js?v=47"></script>
</body>
</html>
